id: evaluator-flow-evidence
version: 0.1.0
kind: au
purpose: |
  Evaluate post-execution trace evidence for employment-shaped resolved plans:
  selected-card eligibility, eligibility before invocation, application completion
  before immutable draft creation, exact-result review, release or quarantine
  order, and released-payload identity. Cite Article 14 through the wiki-store
  governance knowledge plane.
inputs:
  - name: plans
    type: array
    required: true
outputs:
  - name: plan_findings
    type: array
  - name: summary
    type: object
constraints:
  - The output is a single JSON object.
  - Findings assess observed plan and trace evidence only; selected-card eligibility is consumed as plan evidence, not re-scored as a component-card matrix.
  - Employment flows check an eligible selected card, a proceed decision before application invocation, application completion before draft, exact result_digest review with notes, and review before release or quarantine.
  - Approval requires release of the exact approved draft payload; rejection requires quarantine and no released result.
  - Legacy hold, plan-approval, and resume records may be parsed but do not satisfy the current result-governance checks.
  - Queries Article 14 through tool-wiki-store and retains the query, passage ID, source, and complete quote, or marks the finding corpus_silent.
  - Green means only that the specified declared and observed flow evidence is present, never compliance or effective oversight.
  - No output may state or imply legal permission or a compliance determination.
evaluation_signals:
  - valid_output_shape
  - plan_sequence_assessed
  - all_findings_cited
  - corpus_present
  - latency_p95_under(20s)
provenance:
  model: none
