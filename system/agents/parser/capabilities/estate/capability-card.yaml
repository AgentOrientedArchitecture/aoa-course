id: parser-estate
version: 0.2.0
kind: au
purpose: |
  Inventory the AOA estate's governance artefacts: registered capability cards,
  registry lifecycle state, and observed planner trace evidence. Produces
  component inventory and per-trace eligibility, immutable-draft, exact-result
  review, release, and quarantine evidence for downstream checking.
inputs:
  - name: estate_root
    type: string
    required: true
  - name: include_legacy
    type: boolean
    required: false
outputs:
  - name: inventory
    type: array
  - name: plans
    type: array
  - name: scanned_at
    type: string
  - name: trace_files_scanned
    type: number
  - name: audit_scope
    type: object
constraints:
  - The output is a single JSON object.
  - Reads only via tool-filesystem under its configured root; never mutates the estate.
  - Every inventory row names the capability_id and agent_id it describes and preserves any exact review-before-use declaration found on the card.
  - Every plan row names its trace_id, excludes agent-card-check, flow-audit, and compatibility estate-check self-traces, and reports only fields supported by observed trace records.
  - By default plans contains only traces using the current human-review-before-release governance model; include_legacy=true includes historical traces and audit_scope reports the visible and hidden counts.
  - Current plan evidence preserves selected-card eligibility, release policy, eligibility-before-invocation, application-complete-before-draft, draft and result_digest, review notes and exact digest, release or quarantine order, and released-payload identity.
  - Governance evaluator invocation is control-plane evidence and is not reported as the first application invocation.
  - Legacy hold, plan-approval, and resume events may be retained but never populate or substitute for current result-governance evidence.
  - Plan records are execution evidence, not compliance, legal, effective-oversight, or deployment determinations.
  - Deterministic; no model call is made.
evaluation_signals:
  - valid_output_shape
  - cards_read
  - traces_scanned
  - latency_p95_under(5s)
provenance:
  model: none
