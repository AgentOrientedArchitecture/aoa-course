id: reporter-findings
version: 0.2.0
kind: au
purpose: |
  Render an estate-check findings report for a human reader: primary
  end-to-end plan governance, a component evidence appendix, non-green detail
  with evaluator-supplied evidence and regulation citations, and corpus gaps.
  Findings and evidence only - never a compliance verdict.
inputs:
  - name: inventory
    type: array
    required: true
  - name: plans
    type: array
    required: true
  - name: findings
    type: object
    required: true
outputs:
  - name: findings_markdown
    type: string
constraints:
  - The output is a single JSON object.
  - The report opens with the fixed scope banner and closes with the evidence-by-construction footer.
  - End-to-end plan governance is the primary section and contains one table per observed plan/trace; an empty plans array is rendered explicitly rather than treated as an error.
  - Non-green plan detail uses evaluator-supplied evidence and regulation citations without re-scoring or inventing evidence.
  - Component evidence is an appendix and states that individual AU evidence does not establish composition or use-context appropriateness.
  - The report never contains the words compliant, complies, or certified.
  - Annex III marker matches are rendered as candidates for contextual legal assessment, not classifications.
  - Regulation citations include the complete retrieved passage and are never character-truncated.
  - Deterministic template; no model call is made.
evaluation_signals:
  - valid_output_shape
  - has_markdown
  - no_compliance_verdict
  - all_plans_rendered
  - all_findings_rendered
provenance:
  model: none
