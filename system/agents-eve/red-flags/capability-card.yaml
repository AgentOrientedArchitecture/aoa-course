id: red-flags-review
version: 0.1.0
kind: au
purpose: |
  Surface risks in a CV-fit evaluation for a human interviewer to probe.
inputs:
  - name: evaluation
    type: object
    required: true
outputs:
  - name: flags
    type: array
  - name: report_markdown
    type: string
constraints:
  - The output is a single JSON object.
  - flags is an array whose items contain severity, area, concern, and follow_up.
  - The capability does not make or recommend a hiring decision.
  # Lab: add one constraint that matters in your own employment context.
evaluation_signals:
  - valid_output_shape
  - has_flags
  - latency_p95_under(12s)
provenance:
  model: ${MODEL}
