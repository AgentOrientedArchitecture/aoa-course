# Session 4 is a three-stage learner path: agent-card evidence, governed CV fit,
# then a post-execution flow audit. The wiki store remains the regulations
# corpus behind the evidence evaluators (seed it with session4-seed.sh or .bat).
#
# Use with:
#   docker compose --env-file .env -f system/docker-compose.yml -f system/docker-compose.session4.yml --profile session4 up --build -d --remove-orphans

services:
  registry:
    environment:
      REGISTRY_CARD_ALLOWLIST: tool-filesystem,tool-document-text,tool-wiki-store,parser-cv,evaluator-cv,evaluator-plan-governance,reporter-cv-fit,parser-estate,evaluator-agent-evidence,evaluator-flow-evidence,reporter-agent-evidence,reporter-flow-audit

  planner:
    environment:
      # Deterministic keeps all three learner stages reliable instead of asking
      # a small local model to rediscover each course workflow.
      PLANNER_STRATEGY: deterministic
      PLAN_GOVERNANCE_CAPABILITY: evaluator-plan-governance
      PLAN_APPROVER_ID: urn:aoa:human:course-plan-approver

  studio:
    environment:
      STUDIO_WORKFLOWS: agent-card-check,cv-fit,flow-audit

  tool-filesystem:
    volumes:
      # The estate's own governance artefacts, read-only: the registry's
      # persisted card record and the planner's traces. The estate scanner
      # reads governance as ordinary files under /data/estate.
      - ./services/registry/data:/data/estate/registry:ro
      - ./services/planner/traces:/data/estate/traces:ro

  evaluator:
    environment:
      CAPABILITY_ALLOWLIST: evaluator-cv,evaluator-agent-evidence,evaluator-flow-evidence,evaluator-plan-governance

  reporter:
    environment:
      CAPABILITY_ALLOWLIST: reporter-cv-fit,reporter-agent-evidence,reporter-flow-audit
