# Session 3 build-then-adopt lab.
#
# The checked-in workshop has no agent. The learner first uses the real EVE CLI
# in the pinned image to scaffold one, gives it a bounded job, and runs it
# natively. The wrapped service then adds the generic AOA boundary around the
# unchanged workspace. Node, npm, EVE, and dependencies remain in containers.

services:
  registry:
    environment:
      REGISTRY_CARD_ALLOWLIST: tool-document-text,parser-cv,evaluator-cv,reporter-cv-fit,interviewer-questions



  eve-workshop-native:
    profiles: ["session3-lab-native"]
    build:
      context: ./agents-eve
      dockerfile: runtime/Dockerfile
    image: aoa-course/eve-workshop:0.17.1
    container_name: aoa-eve-workshop-native
    working_dir: /workshop
    command: ["/app/workshop-shell.sh"]
    ports:
      - "7310:3000"
    volumes:
      - ./agents-eve/workshop:/workshop
    environment:
      PROVIDER: ${PROVIDER:-ollama}
      MODEL: ${MODEL:-gpt-oss:120b}
      OPENAI_API_KEY: ${AOA_OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      MODEL_CONTEXT_WINDOW_TOKENS: ${MODEL_CONTEXT_WINDOW_TOKENS:-128000}
      NPM_CONFIG_OFFLINE: "true"

  eve-workshop-wrapped:
    profiles: ["session3-lab-wrapped"]
    build:
      context: ./agents-eve
      dockerfile: runtime/Dockerfile
    image: aoa-course/eve-workshop:0.17.1
    container_name: aoa-eve-workshop-wrapped
    working_dir: /workshop
    command: ["node", "/app/adapter/generic-boot.mjs"]
    ports:
      - "7311:8888"
    volumes:
      - ./agents-eve/workshop:/workshop
    environment:
      EVE_APP_ROOT: /workshop
      CARD_PATH: /workshop/capability-card.yaml
      REGISTRY_URL: http://registry:7100
      PLANNER_URL: http://planner:7200
      AGENT_ID: urn:aoa:agent:eve-workshop-interviewer
      AGENT_NAME: eve-workshop-interviewer
      AGENT_HOST: eve-workshop-wrapped
      AGENT_PORT: 8888
      PROVIDER: ${PROVIDER:-ollama}
      MODEL: ${MODEL:-gpt-oss:120b}
      OPENAI_API_KEY: ${AOA_OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      MODEL_CONTEXT_WINDOW_TOKENS: ${MODEL_CONTEXT_WINDOW_TOKENS:-128000}
      NPM_CONFIG_OFFLINE: "true"
    depends_on:
      registry:
        condition: service_healthy
