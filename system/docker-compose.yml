    depends_on:
      registry:
        condition: service_healthy
      tool-document-text:
        condition: service_started
  cv-frontend-evaluator:
    profiles:
    - session1
    - session2
    - session3
    - session4
    build:
      context: ./agents
      dockerfile: evaluator/Dockerfile
    image: aoa-course/evaluator:latest
    container_name: aoa-cv-frontend-evaluator
    extra_hosts:
