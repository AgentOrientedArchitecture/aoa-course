# Current course: one Compose definition, selected by the session launchers.
# Keep private configuration in the repository-root .env.
services:
  registry:
    profiles:
    - session1
    - session2
    - session3
    - session4
    build:
      context: ./services/registry
    image: aoa-course/registry:latest
    container_name: aoa-registry
    ports:
    - 7100:7100
    volumes:
    - ./services/registry/data:/data
    environment:
      REGISTRY_DATA_DIR: /data
      REGISTRY_CARD_ALLOWLIST: ${COURSE_REGISTRY_ALLOWLIST:-tool-filesystem,tool-document-text,tool-wiki-store,parser-cv,parser-notes,parser-query,parser-estate,evaluator-cv,evaluator-cv-data,evaluator-cv-frontend,evaluator-promote,evaluator-wiki-query,evaluator-plan-governance,evaluator-agent-evidence,evaluator-flow-evidence,reporter-cv-fit,reporter-ingest-summary,reporter-answer,reporter-agent-evidence,reporter-flow-audit,interviewer-questions}
      REGISTRY_PUBLISHER_AGENT_ID: ${REGISTRY_PUBLISHER_AGENT_ID:-urn:aoa:role:platform-team-publisher}
      REGISTRY_APPROVER_AGENT_ID: ${REGISTRY_APPROVER_AGENT_ID:-urn:aoa:role:risk-curator-approver}
      REGISTRY_REVIEWER_AGENT_ID: ${REGISTRY_REVIEWER_AGENT_ID:-urn:aoa:role:registry-reviewer}
      REGISTRY_DEFAULT_LIFECYCLE_STATUS: ${REGISTRY_DEFAULT_LIFECYCLE_STATUS:-approved}
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:7100/healthz', timeout=2).status
        == 200 else 1)
      interval: 5s
      timeout: 3s
      retries: 20
  planner:
    profiles:
    - session1
    - session2
    - session3
    - session4
    build:
      context: ./services/planner
    image: aoa-course/planner:latest
    container_name: aoa-planner
    extra_hosts:
    - host.docker.internal:host-gateway
    ports:
    - 7200:7200
    volumes:
    - ./services/planner/traces:/data/traces
    environment:
      REGISTRY_URL: http://registry:7100
      PLANNER_TRACES_DIR: /data/traces
      PLANNER_INVOKE_TIMEOUT: ${PLANNER_INVOKE_TIMEOUT:-300}
      PLANNER_STRATEGY: ${COURSE_PLANNER_STRATEGY:-${PLANNER_STRATEGY:-hybrid}}
      PLANNER_MODEL_TIMEOUT_SECONDS: ${PLANNER_MODEL_TIMEOUT_SECONDS:-60}
      PLANNER_MODEL_MAX_TOKENS: ${PLANNER_MODEL_MAX_TOKENS:-2048}
      PROVIDER: ${PROVIDER:-ollama}
      MODEL: ${MODEL:-gpt-oss:120b}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-low}
      OPENAI_RESPONSE_FORMAT: ${OPENAI_RESPONSE_FORMAT:-json_object}
      OLLAMA_RESPONSE_FORMAT: ${OLLAMA_RESPONSE_FORMAT:-json}
      OLLAMA_THINK: ${OLLAMA_THINK:-false}
      DECISION_URL: http://decision:7250
      DECISION_TIMEOUT_SECONDS: ${DECISION_TIMEOUT_SECONDS:-120}
      DECISION_MIN_PROBABILITY: ${DECISION_MIN_PROBABILITY:-0.65}
      DECISION_ALLOW_UNSCORED: ${DECISION_ALLOW_UNSCORED:-false}
      ALLOCATION_MODE: decision
      DISCOVERY_BACKEND: ${COURSE_DISCOVERY_BACKEND:-local}
      DIRECTORY_BRIDGE_URL: http://directory-bridge:8892
      DURABLE_CASES: 'true'
      CASE_DB_PATH: /data/traces/cases.sqlite3
      PLAN_GOVERNANCE_CAPABILITY: ${COURSE_PLAN_GOVERNANCE_CAPABILITY:-}
    depends_on:
      registry:
        condition: service_healthy
  studio:
    profiles:
    - session1
    - session2
    - session3
    - session4
    build:
      context: ./services/studio
    image: aoa-course/studio:latest
    container_name: aoa-studio
    ports:
    - 8080:8080
    volumes:
    - ./inbox:/data/inbox
    - ../course:/data/course:ro
    environment:
      REGISTRY_URL: http://registry:7100
      PLANNER_URL: http://planner:7200
      INBOX_DIR: /data/inbox
      PLANNER_REQUEST_TIMEOUT: ${PLANNER_REQUEST_TIMEOUT:-420}
      STUDIO_WORKFLOWS: ${COURSE_STUDIO_WORKFLOWS:-cv-fit,knowledge-ingest,wiki-graph,knowledge-query}
      AOA_REVISED: 'true'
      DISCOVERY_BACKEND: ${COURSE_DISCOVERY_BACKEND:-local}
      STUDIO_ALLOW_WIKI_RESET: ${COURSE_ALLOW_WIKI_RESET:-true}
    depends_on:
      registry:
        condition: service_healthy
      planner:
        condition: service_started
  tool-filesystem:
    profiles:
    - session2
    build:
      context: ./tools/filesystem
    image: aoa-course/tool-filesystem:latest
    container_name: aoa-tool-filesystem
    ports:
    - 7401:7401
    volumes:
    - ./inbox:/data/inbox:ro
    environment:
      REGISTRY_URL: http://registry:7100
      TOOL_HOST: tool-filesystem
      TOOL_PORT: 7401
      FS_ROOT: /data
    depends_on:
      registry:
        condition: service_healthy
  tool-document-text:
    profiles:
    - session1
    - session2
    - session3
    - session4
    build:
      context: ./tools/document-text
    image: aoa-course/tool-document-text:latest
    container_name: aoa-tool-document-text
    ports:
    - 7402:7402
    volumes:
    - ./inbox:/data/inbox:ro
    environment:
      REGISTRY_URL: http://registry:7100
      TOOL_HOST: tool-document-text
      TOOL_PORT: 7402
      FS_ROOT: /data
    depends_on:
      registry:
        condition: service_healthy
  tool-wiki-store:
    profiles:
    - session2
    - session4
    build:
      context: ./tools/wiki-store
    image: aoa-course/tool-wiki-store:latest
    container_name: aoa-tool-wiki-store
    ports:
    - 7403:7403
    volumes:
    - ./wiki:/data/wiki
    - ./inbox:/data/inbox:ro
    environment:
      REGISTRY_URL: http://registry:7100
      TOOL_HOST: tool-wiki-store
      TOOL_PORT: 7403
      FS_ROOT: /data
      WIKI_ROOT: /data/wiki
    depends_on:
      registry:
        condition: service_healthy
  cv-parser:
    profiles:
    - session1
    - session2
    - session3
    - session4
    build:
      context: ./agents
      dockerfile: parser/Dockerfile
    image: aoa-course/parser:latest
    container_name: aoa-cv-parser
    extra_hosts:
    - host.docker.internal:host-gateway
    ports:
    - 7301:8888
    volumes:
    - ./agents/parser/capabilities:/app/capabilities:ro
    - ./inbox:/data/inbox:ro
    environment:
      REGISTRY_URL: http://registry:7100
      PLANNER_URL: http://planner:7200
      AGENT_ID: urn:aoa:agent:cv-parser
      AGENT_NAME: cv-parser
      AGENT_HOST: cv-parser
      AGENT_PORT: 8888
      CAPABILITY_ALLOWLIST: parser-cv
      PROVIDER: ${PROVIDER:-ollama}
      MODEL: ${MODEL:-gpt-oss:120b}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-240}
      MODEL_MAX_TOKENS: ${MODEL_MAX_TOKENS:-8192}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-low}
      OPENAI_RESPONSE_FORMAT: ${OPENAI_RESPONSE_FORMAT:-json_object}
      OLLAMA_RESPONSE_FORMAT: ${OLLAMA_RESPONSE_FORMAT:-json}
      OLLAMA_THINK: ${OLLAMA_THINK:-false}
    depends_on:
      registry:
        condition: service_healthy
      tool-document-text:
        condition: service_started
  wiki-parser:
    profiles:
    - session2
    - session4
    build:
      context: ./agents
      dockerfile: parser/Dockerfile
    image: aoa-course/parser:latest
    container_name: aoa-wiki-parser
    extra_hosts:
    - host.docker.internal:host-gateway
    ports:
    - 7304:8888
    volumes:
    - ./agents/parser/capabilities:/app/capabilities:ro
    - ./inbox:/data/inbox:ro
    environment:
      REGISTRY_URL: http://registry:7100
      PLANNER_URL: http://planner:7200
      AGENT_ID: urn:aoa:agent:wiki-parser
      AGENT_NAME: wiki-parser
      AGENT_HOST: wiki-parser
      AGENT_PORT: 8888
      CAPABILITY_ALLOWLIST: parser-notes,parser-query
      PROVIDER: ${PROVIDER:-ollama}
      MODEL: ${MODEL:-gpt-oss:120b}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-240}
      MODEL_MAX_TOKENS: ${MODEL_MAX_TOKENS:-8192}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-low}
      OPENAI_RESPONSE_FORMAT: ${OPENAI_RESPONSE_FORMAT:-json_object}
      OLLAMA_RESPONSE_FORMAT: ${OLLAMA_RESPONSE_FORMAT:-json}
      OLLAMA_THINK: ${OLLAMA_THINK:-false}
    depends_on:
