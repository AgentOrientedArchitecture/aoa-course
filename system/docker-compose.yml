  ollama:
    image: ollama/ollama:latest
    container_name: aoa-ollama
    profiles:
    - local
    ports:
    - 11434:11434
    volumes:
    - ollama-models:/root/.ollama
  agntcy-directory:
    profiles:
    - directory
    build:
      context: ..
      dockerfile: system/services/directory/Dockerfile
    image: aoa-course/directory:1.8.0
    user: ${DIRECTORY_UID:-1000}:${DIRECTORY_GID:-1000}
    ports:
    - 127.0.0.1:${COURSE_DIRECTORY_PORT:-8890}:8890
    - 127.0.0.1:${COURSE_DIRECTORY_UI_PORT:-8891}:8889
    volumes:
    - ${COURSE_DIRECTORY_DATA_ROOT:-../.course-data}:/course-data
    - ./agents-eve/runtime/templates:/course-templates:ro
    - ./agents-eve/workshop:/workshop:ro
    environment:
      DIRECTORY_DAEMON_SERVER_LISTEN_ADDRESS: 0.0.0.0:8890
      DIRECTORY_DAEMON_SERVER_HTTP_GATEWAY_ENABLED: 'true'
      DIRECTORY_DAEMON_SERVER_HTTP_GATEWAY_LISTEN_ADDRESS: 0.0.0.0:8889
      DIRECTORY_DAEMON_SERVER_HTTP_GATEWAY_PUBLIC_URL: http://localhost:${COURSE_DIRECTORY_UI_PORT:-8891}
      COURSE_DIRECTORY_ADDR: 127.0.0.1:8890
      COURSE_REGISTRY_URL: http://registry:7100
    healthcheck:
      test:
      - CMD
      - dirctl
      - --server-addr
      - 127.0.0.1:8890
      - --auth-mode
      - insecure
      - search
      - --name
      - __aoa_healthcheck__
      - --output
      - json
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
  directory-bridge:
    profiles:
    - directory
    build:
      context: ..
      dockerfile: system/services/directory/Dockerfile
    image: aoa-course/directory:1.8.0
    command:
    - python
    - /app/bridge.py
    environment:
      COURSE_DIRECTORY_ADDR: agntcy-directory:8890
      COURSE_REGISTRY_URL: http://registry:7100
      COURSE_DIRECTORY_EXPECTED_AUS: ${COURSE_DIRECTORY_EXPECTED_AUS:-}
    depends_on:
      agntcy-directory:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8892/healthz', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 24
  eve-workshop-native:
    profiles:
    - session3-lab-native
    build:
      context: ./agents-eve
      dockerfile: runtime/Dockerfile
    image: aoa-course/eve-workshop:0.17.1
    container_name: aoa-eve-workshop-native
    extra_hosts:
    - host.docker.internal:host-gateway
    working_dir: /workshop
    command:
    - /app/workshop-shell.sh
    ports:
    - 7310:3000
    volumes:
    - ./agents-eve/workshop:/workshop
    environment:
      PROVIDER: ${PROVIDER:-ollama}
      MODEL: ${MODEL:-gpt-oss:120b}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      MODEL_CONTEXT_WINDOW_TOKENS: ${MODEL_CONTEXT_WINDOW_TOKENS:-128000}
      NPM_CONFIG_OFFLINE: 'true'
  eve-workshop-wrapped:
    profiles:
    - session3-lab-wrapped
    build:
      context: ./agents-eve
      dockerfile: runtime/Dockerfile
    image: aoa-course/eve-workshop:0.17.1
    container_name: aoa-eve-workshop-wrapped
    extra_hosts:
    - host.docker.internal:host-gateway
    working_dir: /workshop
    command:
    - node
    - /app/adapter/generic-boot.mjs
    ports:
    - 7311:8888
    volumes:
    - ./agents-eve/workshop:/workshop
    environment:
      EVE_APP_ROOT: /workshop
      CARD_PATH: /workshop/capability-card.yaml
      REGISTRY_URL: http://registry:7100
      PLANNER_URL: http://planner:7200
      AGENT_ID: urn:aoa:agent:eve-workshop-interviewer
      AGENT_NAME: eve-workshop-interviewer
      AGENT_HOST: eve-workshop-wrapped
      AGENT_PORT: 8888
      PROVIDER: ${PROVIDER:-ollama}
      MODEL: ${MODEL:-gpt-oss:120b}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      MODEL_CONTEXT_WINDOW_TOKENS: ${MODEL_CONTEXT_WINDOW_TOKENS:-128000}
      NPM_CONFIG_OFFLINE: 'true'
    depends_on:
      registry:
        condition: service_healthy
  decision:
    profiles:
    - session1
    - session2
    - session3
    - session4
    build: ./services/decision
    image: aoa-course/decision:latest
    container_name: aoa-decision
    extra_hosts:
    - host.docker.internal:host-gateway
    ports:
    - 127.0.0.1:7250:7250
    environment:
      DECISION_LOCAL_CONTEXT_TOKENS: ${DECISION_LOCAL_CONTEXT_TOKENS:-8192}
      DECISION_PROVIDER: ${DECISION_PROVIDER:-typesafe}
      DECISION_MODEL: ${DECISION_MODEL:-jev-1.13.0}
      DECISION_BASE_URL: ${DECISION_BASE_URL:-https://api.typesafe.ai}
      DECISION_API_KEY: ${DECISION_API_KEY:-}
      DECISION_TIMEOUT_SECONDS: ${DECISION_TIMEOUT_SECONDS:-120}
  cv-data-evaluator:
    profiles:
    - session1
    - session2
    - session3
    - session4
    build:
      context: ./agents
      dockerfile: evaluator/Dockerfile
    image: aoa-course/evaluator:latest
    container_name: aoa-cv-data-evaluator
    extra_hosts:
    - host.docker.internal:host-gateway
    volumes:
    - ./agents/evaluator/capabilities:/app/capabilities:ro
