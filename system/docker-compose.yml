      AGENT_NAME: cv-frontend-evaluator
      AGENT_HOST: cv-frontend-evaluator
      AGENT_PORT: 8888
      CAPABILITY_ALLOWLIST: evaluator-cv-frontend
      PROVIDER: ${PROVIDER:-openai}
      MODEL: ${MODEL:-gpt-oss-120b}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-240}
      MODEL_MAX_TOKENS: ${MODEL_MAX_TOKENS:-8192}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-low}
      OPENAI_RESPONSE_FORMAT: ${OPENAI_RESPONSE_FORMAT:-json_object}
      OLLAMA_RESPONSE_FORMAT: ${OLLAMA_RESPONSE_FORMAT:-json}
      OLLAMA_THINK: ${OLLAMA_THINK:-false}
    depends_on:
      registry:
        condition: service_healthy
      tool-document-text:
        condition: service_started
  estate-filesystem:
    profiles:
    - session4
    build:
      context: ./tools/filesystem
    image: aoa-course/tool-filesystem:latest
    container_name: aoa-estate-filesystem
    ports:
    - 7401:7401
    volumes:
    - ./inbox:/data/inbox:ro
    - ./services/registry/data:/data/estate/registry:ro
    - ./services/planner/traces:/data/estate/traces:ro
    environment:
      REGISTRY_URL: http://registry:7100
      TOOL_HOST: tool-filesystem
      TOOL_PORT: 7401
      FS_ROOT: /data
    depends_on:
      registry:
        condition: service_healthy
    networks:
      default:
        aliases:
        - tool-filesystem
volumes:
  ollama-models: null
