<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">The result belongs to a continuing case</title><desc id="desc">Session 4 · persist the exact draft and the decision made about it.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#516775"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#203847}.title{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#536875}.head{font-size:23px;font-weight:700}.body{font-size:18px}.label{font-size:16px;fill:#405866;paint-order:stroke;stroke:#fafbf9;stroke-width:7px;stroke-linejoin:round}</style>
<rect width="1200" height="850" fill="#fafbf9"/>
<text x="40" y="48" class="title">The result belongs to a continuing case</text>
<text x="40" y="82" class="sub">Session 4 · persist the exact draft and the decision made about it.</text>
<rect x="40" y="140" width="300" height="125" rx="12" fill="#eaf1fb" stroke="#32649a" stroke-width="1.5"/>
<rect x="40" y="155" width="5" height="95" rx="2" fill="#32649a"/>
<text x="60" y="175" class="head" text-anchor="start">Check eligibility</text>
<text x="60" y="205" class="body" text-anchor="start">Selected cards + release policy</text>
<text x="60" y="231" class="body" text-anchor="start">Wiki supplies cited rationale</text>
<rect x="450" y="140" width="300" height="125" rx="12" fill="#e7f4ee" stroke="#23775b" stroke-width="1.5"/>
<rect x="450" y="155" width="5" height="95" rx="2" fill="#23775b"/>
<text x="470" y="175" class="head" text-anchor="start">Run the application AUs</text>
<text x="470" y="205" class="body" text-anchor="start">Read / compute / draft</text>
<text x="470" y="231" class="body" text-anchor="start">No employment action</text>
<rect x="860" y="140" width="300" height="125" rx="12" fill="#f0ecfa" stroke="#715391" stroke-width="1.5"/>
<rect x="860" y="155" width="5" height="95" rx="2" fill="#715391"/>
<text x="880" y="175" class="head" text-anchor="start">Hold the draft</text>
<text x="880" y="205" class="body" text-anchor="start">Freeze the result and digest</text>
<text x="880" y="231" class="body" text-anchor="start">Save with the case and events</text>
<rect x="40" y="365" width="300" height="100" rx="12" fill="#fbeeed" stroke="#a94d44" stroke-width="1.5"/>
<rect x="40" y="380" width="5" height="70" rx="2" fill="#a94d44"/>
<text x="60" y="400" class="head" text-anchor="start">Rejected</text>
<text x="60" y="430" class="body" text-anchor="start">No application invocation</text>
<rect x="450" y="365" width="300" height="100" rx="12" fill="#fbeeed" stroke="#a94d44" stroke-width="1.5"/>
<rect x="450" y="380" width="5" height="70" rx="2" fill="#a94d44"/>
<text x="470" y="400" class="head" text-anchor="start">Interrupted</text>
<text x="470" y="430" class="body" text-anchor="start">Inspect; no automatic rerun</text>
<rect x="860" y="365" width="300" height="100" rx="12" fill="#eaf1fb" stroke="#32649a" stroke-width="1.5"/>
<rect x="860" y="380" width="5" height="70" rx="2" fill="#32649a"/>
<text x="880" y="400" class="head" text-anchor="start">Human review</text>
<text x="880" y="430" class="body" text-anchor="start">Exact digest + reviewer notes</text>
<rect x="665" y="575" width="235" height="100" rx="12" fill="#e7f4ee" stroke="#23775b" stroke-width="1.5"/>
<rect x="665" y="590" width="5" height="70" rx="2" fill="#23775b"/>
<text x="685" y="610" class="head" text-anchor="start">Released</text>
<text x="685" y="640" class="body" text-anchor="start">Identical reviewed draft</text>
<rect x="925" y="575" width="235" height="100" rx="12" fill="#fbeeed" stroke="#a94d44" stroke-width="1.5"/>
<rect x="925" y="590" width="5" height="70" rx="2" fill="#a94d44"/>
<text x="945" y="610" class="head" text-anchor="start">Quarantined</text>
<text x="945" y="640" class="body" text-anchor="start">Result withheld</text>
<path d="M340 200H450" fill="none" stroke="#516775" stroke-width="2" marker-end="url(#arrow)"/>
<text x="395" y="186" class="label" text-anchor="middle">proceed</text>
<path d="M750 200H860" fill="none" stroke="#516775" stroke-width="2" marker-end="url(#arrow)"/>
<text x="805" y="186" class="label" text-anchor="middle">completed</text>
<path d="M190 265V365" fill="none" stroke="#516775" stroke-width="2" marker-end="url(#arrow)"/>
<text x="190" y="320" class="label" text-anchor="middle">ineligible</text>
<path d="M600 265V365" fill="none" stroke="#516775" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600" y="320" class="label" text-anchor="middle">restart during execution</text>
<path d="M1010 265V365" fill="none" stroke="#516775" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1010" y="320" class="label" text-anchor="middle">reopen saved case</text>
<path d="M960 465V520H782V575" fill="none" stroke="#516775" stroke-width="2" marker-end="url(#arrow)"/>
<text x="850" y="507" class="label" text-anchor="middle">approve</text>
<path d="M1060 465V575" fill="none" stroke="#516775" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1100" y="525" class="label" text-anchor="middle">reject</text>
<rect x="40" y="725" width="1120" height="90" rx="12" fill="#f0ecfa" stroke="#715391" stroke-width="1.5"/>
<rect x="40" y="740" width="5" height="60" rx="2" fill="#715391"/>
<text x="60" y="760" class="head" text-anchor="start">SQLite is authoritative; JSONL is an audit projection</text>
<text x="60" y="790" class="body" text-anchor="start">A held draft survives restart. Identical review retries add no second release. External effects are not replayed.</text>
</svg>
