name: Course launchers
on:
  push:
    branches: [main]
    paths: ['.env.example', 'scripts/**', 'system/docker-compose*.yml', 'system/services/directory/**', 'system/agents-eve/runtime/**', 'system/services/planner/**', 'tests/**', '.github/workflows/launcher-checks.yml']
  pull_request:
    paths: ['.env.example', 'scripts/**', 'system/docker-compose*.yml', 'system/services/directory/**', 'system/agents-eve/runtime/**', 'system/services/planner/**', 'tests/**', '.github/workflows/launcher-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launchers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check actual launchers without Docker or provider calls
        run: python -m unittest discover -s tests -p test_launchers.py -v
  directory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare effective session configuration
        run: python tests/check_course_configuration.py
      - name: Real Directory publish, retrieve and restart
        run: python tests/check_directory_container.py
      - name: Native EVE as a non-root learner
        run: python tests/check_eve_workshop.py
      - name: Planner discovery and adoption boundary checks
        run: |
          python -m pip install -r tests/requirements.txt
          python -m pytest -q tests
